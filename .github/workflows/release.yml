name: Release
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-26-intel, ubuntu-24.04-arm, windows-11-arm, macos-latest ]
        include:
          # x86
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-26-intel
            label: macos-intel

          # arm64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-11-arm
            label: windows-arm64
          - os: macos-latest
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache rust dependencies
        uses: actions/cache@v3
        with:
          path: ${{ env.CARGO_HOME }}
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project
        run: cargo build --release

      - name: Rename artifact
        run: mv target/release/server${{ case(contains(matrix.label, 'windows'), '.exe', '') }} target/release/roffen-${{ matrix.label }}${{ case(contains(matrix.label, 'windows'), '.exe', '') }}

      - name: Create release
        id: create-release
        uses: googleapis/release-please-action@v4
        with:
          token: '${{ github.token }}'
          release-type: 'rust'
          skip-github-pull-request: true

      - name: Upload artifact
        if: ${{ steps.create-release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.create-release.outputs.release_tag }} target/release/roffen-${{ matrix.label }}${{ case(contains(matrix.label, 'windows'), '.exe', '') }}