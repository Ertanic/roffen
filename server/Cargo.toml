[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
fern = { version = "0.7.1", features = ["colored"] }
futures-util = { version = "0.3.31", features = ["io-compat"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["full"] }
jiff = "0.2.17"
log = "0.4.29"
matchit = "0.9.0"
mime_guess2 = "2.3.1"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.17", features = ["io", "compat"] }
upon = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.10"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
cookie = "0.18.1"
url_encoded_data = "0.6.1"
vfs = { version = "0.12.2", features = ["async-vfs"] }
rust-embed = "8.9.0"
async-trait = "0.1.89"
tree-ds = { version = "0.2.0", features = ["async"] }
notify = { version = "8.2.0", features = ["crossbeam-channel"] }
crossbeam-channel = "0.5.15"
ron = "0.12.0"
small_uid = "0.2.4"
serde_json = "1.0.148"

[build-dependencies]
glob = "0.3"