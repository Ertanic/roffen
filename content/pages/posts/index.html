<!doctype html>
<html lang="en">
<head>
    {% include "head" %}
    <style>
        .card main {
            padding: 16px;
        }
    </style>
    <title>Posts</title>
</head>
<body>
{% include "header" %}
<main class="flex three">
    <section></section>
    <section>
        <h1>Posts</h1>
        {% with all_posts() as posts %}
        {% for post in posts %}
        {% if not post.draft %}
        <article class="card">
            <header>
                <h3>{{ post.title }}</h3>
            </header>
            <main class="grid-content">
                {% for comp in post.content | take: 2 %}

                <div data-type="{{ comp.name }}"
                     {% for key, val in comp.data %}
                     data-{{ key }}="{{ val }}"
                     {% endfor %}
                ></div>

                {% endfor %}
            </main>
            <footer>
                <a href="/posts/{{post.id}}">
                    <button>Go to post</button>
                </a>
            </footer>
        </article>
        {% endif %}
        {% endfor %}
        {% endwith %}
    </section>
</main>
{% include "footer" %}
</body>
</html>
